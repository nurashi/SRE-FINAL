name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: app/go.sum

      - name: Vet
        working-directory: ./app
        run: go vet ./...

      - name: Build
        working-directory: ./app
        run: go build -o /dev/null ./...

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    needs: build-and-test
    if: github.event_name == 'push'
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sre-final

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy with Docker Compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans
          docker compose -f docker-compose.yml ps

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Service healthy after ${i} attempts"
              exit 0
            fi
            echo "Waiting for service... attempt ${i}/30"
            sleep 2
          done
          echo "Service failed to become healthy"
          exit 1

  prometheus-validate:
    name: Validate Prometheus Config
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Prometheus config
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v $(pwd)/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml \
            prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml

      - name: Validate alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v $(pwd)/slo/rules.yml:/etc/prometheus/rules.yml \
            prom/prometheus:v3.2.1 check rules /etc/prometheus/rules.yml
